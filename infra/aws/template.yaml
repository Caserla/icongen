AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: IconGen asynchronous image generation worker

Parameters:
  ImageProvider:
    Type: String
    Default: openai
  ImageModel:
    Type: String
    Default: gpt-image-2
  IconSkill:
    Type: String
    Default: default-ui-icon
  SupabaseUrl:
    Type: String
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
  ImageProviderApiKey:
    Type: String
    NoEcho: true
  ReservedConcurrency:
    Type: Number
    Default: 5

Resources:
  GenerationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  GenerationQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 960
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt GenerationDeadLetterQueue.Arn
        maxReceiveCount: 3

  IconWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handler.ts
        Minify: true
        Sourcemap: true
        Target: es2022
    Properties:
      CodeUri: ../../services/icon-worker
      Handler: src/handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 2048
      Timeout: 900
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          IMAGE_PROVIDER: !Ref ImageProvider
          IMAGE_MODEL: !Ref ImageModel
          IMAGE_PROVIDER_API_KEY: !Ref ImageProviderApiKey
          ICON_SKILL: !Ref IconSkill
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          SUPABASE_ICON_BUCKET: generated-icons
          GENERATION_MAX_ATTEMPTS: "3"
      Events:
        GenerationMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt GenerationQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Icon generation messages reached the DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt GenerationDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  GenerationQueueUrl:
    Value: !Ref GenerationQueue
  GenerationQueueArn:
    Value: !GetAtt GenerationQueue.Arn
  GenerationDeadLetterQueueUrl:
    Value: !Ref GenerationDeadLetterQueue
