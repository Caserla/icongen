services:
  web:
    build:
      context: .
      target: web-runtime
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      LOCAL_VARIANT_WORKER_ENABLED: "false"
      APP_ENV: ${APP_ENV}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
      SUPABASE_ENVIRONMENT: ${SUPABASE_ENVIRONMENT}
      IMAGE_PROVIDER_API_KEY: ""
      IMAGE_PROVIDER_BASE_URL: ""
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=128m,uid=1000,gid=1000
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5

  worker:
    build:
      context: .
      target: worker-runtime
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: ${APP_ENV}
      SUPABASE_ENVIRONMENT: ${SUPABASE_ENVIRONMENT}
      SUPABASE_URL: ${SUPABASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/icongen-worker-heartbeat && test $$(($$(date +%s)-$$(date -r /tmp/icongen-worker-heartbeat +%s))) -lt 60"]
      interval: 20s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.basic:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

volumes:
  caddy_data:
  caddy_config:
